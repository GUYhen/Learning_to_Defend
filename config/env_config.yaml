env:
  name: "StackelbergDefenseEnv"
  num_nodes: 30
  num_critical_nodes: 10
  max_steps: 1000
  
network:
  connection_prob: 0.15
  min_degree: 2
  max_degree: 8
  epsilon: 1e-6
  
attacker:
  budget: 10.0
  unit_costs: [1.0, 1.2, 0.8, 1.1, 0.9, 1.3, 1.0, 0.7, 1.4, 0.95, 
              1.1, 0.85, 1.2, 0.9, 1.05, 1.15, 0.8, 1.25, 0.75, 1.0,
              1.1, 0.9, 1.3, 0.85, 1.2, 0.95, 1.0, 1.15, 0.8, 1.05]
  baseline_success_prob: 0.1
  
defender:
  budget: 12.0
  unit_costs: [1.2, 1.0, 1.1, 0.9, 1.3, 0.8, 1.15, 1.25, 0.75, 1.05,
              0.95, 1.2, 0.85, 1.1, 0.9, 1.0, 1.3, 0.8, 1.4, 1.05,
              0.9, 1.2, 0.75, 1.15, 0.8, 1.1, 1.25, 0.95, 1.3, 0.9]
  cleaning_difficulty: 2.0
  honeypot_fake_degrees: [5, 6, 7, 4, 8, 6, 5, 7, 6, 5]
  
reward_weights:
  attacker:
    damage_weight: 1.0
    cost_weight: 0.5
  defender:
    protection_weight: 1.0
    honeypot_weight: 0.3
    cleaning_weight: 0.4
    cost_weight: 0.6 